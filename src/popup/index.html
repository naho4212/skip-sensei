<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ad Sensei</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img
          class="brand-icon"
          src="../icons/icon-48.png"
          alt=""
          aria-hidden="true"
        />
        <h1>Ad Sensei</h1>
      </div>
      <label class="switch" title="Master toggle">
        <input type="checkbox" id="master-toggle" />
        <span class="slider"></span>
      </label>
    </header>

    <main>
      <section class="engines">
        <label class="row">
          <span>Skip YouTube ads</span>
          <span class="switch">
            <input type="checkbox" id="ad-engine-toggle" />
            <span class="slider"></span>
          </span>
        </label>
        <label class="row">
          <span>Skip sponsor segments</span>
          <span class="switch">
            <input type="checkbox" id="sponsor-engine-toggle" />
            <span class="slider"></span>
          </span>
        </label>
        <label class="row">
          <span>Block all ads <em class="row-note">across the web</em></span>
          <span class="switch">
            <input type="checkbox" id="block-ads-toggle" />
            <span class="slider"></span>
          </span>
        </label>
        <p class="blocker-note" id="blocker-note" hidden></p>
        <a href="#" id="open-options" class="row link-row">
          <span>AI &amp; skipping settings</span>
          <span class="chevron" aria-hidden="true">›</span>
        </a>
      </section>

      <div class="section-title">Skipped</div>
      <section class="stats">
        <table class="stats-table">
          <thead>
            <tr>
              <th></th>
              <th>Session</th>
              <th>All time</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>YouTube ads</td>
              <td id="session-ad-skips">0</td>
              <td id="alltime-ad-skips">0</td>
            </tr>
            <tr>
              <td>Sponsor segments</td>
              <td id="session-sponsor-skips">0</td>
              <td id="alltime-sponsor-skips">0</td>
            </tr>
          </tbody>
        </table>
      </section>

      <div class="section-title">This video</div>
      <section class="current">
        <p class="status">
          <span id="video-status"></span>
          <button id="reload-tab" hidden>Reload page</button>
        </p>
        <div class="progress" id="analysis-progress" hidden>
          <div class="progress-bar" id="analysis-bar"></div>
        </div>
        <ul class="segments" id="segment-list"></ul>
      </section>

      <footer>
        <a
          href="https://buymeacoffee.com/singlefin"
          target="_blank"
          rel="noopener"
          class="coffee"
          >☕ Buy me a coffee</a
        >
      </footer>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
