<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ad Sensei</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 17" aria-hidden="true">
          <path
            d="M0 1.5l6 7-6 7v-14zm7.5 0l6 7-6 7v-14zm8.5 0h2.4v14H16v-14z"
          />
        </svg>
        <h1 class="wordmark"><span class="ad">AD</span> SENSEI</h1>
      </div>
      <div class="header-actions">
        <button
          type="button"
          id="reload-page"
          class="icon-btn"
          title="Reload this page"
          aria-label="Reload this page"
        >
          ↻
        </button>
        <label class="switch" title="Master toggle">
          <input type="checkbox" id="master-toggle" />
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <main>
      <section class="engines">
        <label class="row">
          <span
            >Skip YouTube ads<span
              class="info"
              tabindex="0"
              data-tip="Automatically skips YouTube's own ads — clicks “Skip” the moment it appears and fast-forwards the rest."
              >ⓘ</span
            ></span
          >
          <span class="switch">
            <input type="checkbox" id="ad-engine-toggle" />
            <span class="slider"></span>
          </span>
        </label>
        <label class="row">
          <span
            >Skip sponsor segments<span
              class="info"
              tabindex="0"
              data-tip="Detects creator-read sponsor segments by AI-analyzing the video transcript, then skips playback past them — even on brand-new uploads."
              >ⓘ</span
            ></span
          >
          <span class="switch">
            <input type="checkbox" id="sponsor-engine-toggle" />
            <span class="slider"></span>
          </span>
        </label>
        <label class="row">
          <span
            >Block all ads<span
              class="info"
              tabindex="0"
              data-tip="Blocks ads (and optionally trackers) across all websites using filter lists. Configure extra lists in settings."
              >ⓘ</span
            ></span
          >
          <span class="switch">
            <input type="checkbox" id="block-ads-toggle" />
            <span class="slider"></span>
          </span>
        </label>
        <div class="blocker-note" id="blocker-note" hidden>
          <span id="blocker-note-text"></span>
          <button class="mini-btn" id="blocker-reload" hidden>↻ Reload</button>
        </div>
        <a href="#" id="open-options" class="row link-row">
          <span>AI &amp; skipping settings</span>
          <span class="chevron" aria-hidden="true">›</span>
        </a>
      </section>

      <div class="section-title">Skipped</div>
      <section class="stats">
        <table class="stats-table">
          <thead>
            <tr>
              <th></th>
              <th>Session</th>
              <th>All time</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>YouTube ads</td>
              <td id="session-ad-skips">0</td>
              <td id="alltime-ad-skips">0</td>
            </tr>
            <tr>
              <td>Sponsor segments</td>
              <td id="session-sponsor-skips">0</td>
              <td id="alltime-sponsor-skips">0</td>
            </tr>
            <tr>
              <td>Web ads blocked</td>
              <td id="session-web-blocks">0</td>
              <td id="alltime-web-blocks">0</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section class="site" id="site-section" hidden>
        <div class="site-head">
          <span id="site-host"></span>
          <span class="page-blocked" id="page-blocked"></span>
        </div>
        <label class="row compact" id="pause-row">
          <span>Pause ad blocking here</span>
          <span class="switch">
            <input type="checkbox" id="pause-site-toggle" />
            <span class="slider"></span>
          </span>
        </label>
      </section>

      <section class="current">
        <p class="status">
          <span id="video-status"></span>
          <button id="reload-tab" hidden>Reload page</button>
        </p>
        <div class="progress" id="analysis-progress" hidden>
          <div class="progress-bar" id="analysis-bar"></div>
        </div>
        <ul class="segments" id="segment-list"></ul>
      </section>

      <footer>
        <button type="button" id="share-btn" class="footer-link">↗ Share</button>
        <span class="footer-sep">·</span>
        <a
          href="https://buymeacoffee.com/singlefin"
          target="_blank"
          rel="noopener"
          class="footer-link coffee"
          >☕ Buy me a coffee</a
        >
      </footer>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
