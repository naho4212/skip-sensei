<!-- @dsCard group="Components" name="Buttons" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { --accent: #7c3aed; }
      body {
        margin: 0; font-family: Roboto, Arial, sans-serif; background: #212121;
        color: #f1f1f1; padding: 32px; display: flex; gap: 16px; align-items: center;
        flex-wrap: wrap; -webkit-font-smoothing: antialiased;
      }
      button { font-family: inherit; font-size: 14px; font-weight: 500;
        height: 36px; padding: 0 18px; border: none; border-radius: 18px; cursor: pointer; }
      .primary { background: var(--accent); color: #fff; }
      .secondary { background: rgba(255,255,255,0.08); color: #f1f1f1; }
      .mini { height: 26px; padding: 0 12px; font-size: 12px; border-radius: 13px;
        background: var(--accent); color: #fff; }
    </style>
  </head>
  <body>
    <button class="primary">Add to Chrome</button>
    <button class="secondary">Open settings</button>
    <button class="mini">↻ Reload</button>
  </body>
</html>
