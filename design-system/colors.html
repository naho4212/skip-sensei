<!-- @dsCard group="Foundations" name="Color tokens" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0; font-family: Roboto, Arial, sans-serif; background: #212121;
        color: #f1f1f1; padding: 28px 32px; -webkit-font-smoothing: antialiased;
      }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
        color: #aaa; margin: 0 0 14px; }
      .row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 26px; }
      .swatch { width: 150px; }
      .chip { height: 56px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); }
      .name { font-size: 13px; font-weight: 500; margin-top: 8px; }
      .hex { font-size: 12px; color: #aaa; font-variant-numeric: tabular-nums; }
      .use { font-size: 11px; color: #888; margin-top: 2px; }
    </style>
  </head>
  <body>
    <h2>Brand</h2>
    <div class="row">
      <div class="swatch"><div class="chip" style="background:#7c3aed"></div>
        <div class="name">accent</div><div class="hex">#7c3aed</div>
        <div class="use">Actions, active toggles, highlights</div></div>
    </div>
    <h2>Neutrals — Dark (default)</h2>
    <div class="row">
      <div class="swatch"><div class="chip" style="background:#212121"></div>
        <div class="name">bg</div><div class="hex">#212121</div></div>
      <div class="swatch"><div class="chip" style="background:#f1f1f1"></div>
        <div class="name">text</div><div class="hex">#f1f1f1</div></div>
      <div class="swatch"><div class="chip" style="background:#aaaaaa"></div>
        <div class="name">text-2</div><div class="hex">#aaaaaa</div></div>
      <div class="swatch"><div class="chip" style="background:#3ea6ff"></div>
        <div class="name">link</div><div class="hex">#3ea6ff</div></div>
    </div>
    <h2>Neutrals — Light</h2>
    <div class="row">
      <div class="swatch"><div class="chip" style="background:#ffffff"></div>
        <div class="name">bg</div><div class="hex">#ffffff</div></div>
      <div class="swatch"><div class="chip" style="background:#0f0f0f"></div>
        <div class="name">text</div><div class="hex">#0f0f0f</div></div>
      <div class="swatch"><div class="chip" style="background:#606060"></div>
        <div class="name">text-2</div><div class="hex">#606060</div></div>
      <div class="swatch"><div class="chip" style="background:#065fd4"></div>
        <div class="name">link</div><div class="hex">#065fd4</div></div>
    </div>
  </body>
</html>
