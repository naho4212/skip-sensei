<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700;900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1400px;height:560px;overflow:hidden}
body{
  font-family:'Roboto',system-ui,Arial,sans-serif;color:#f7f5fc;
  background:
    radial-gradient(1100px 620px at 82% -20%, rgba(124,58,237,.5), transparent 60%),
    radial-gradient(800px 640px at -6% 122%, rgba(109,40,217,.36), transparent 62%),
    linear-gradient(155deg,#141021 0%,#0a0810 62%,#08060d 100%);
  position:relative;display:flex;align-items:center;padding:0 96px;gap:80px;
}
body::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:34px 34px;mask:radial-gradient(900px 480px at 55% 45%,#000,transparent 85%);
  pointer-events:none;
}
.enso{position:absolute;right:-110px;top:-90px;opacity:.14}
.left{position:relative;flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:15px;margin-bottom:30px}
.mark{width:52px;height:52px;border-radius:14px;background:linear-gradient(150deg,#7c3aed,#6d28d9);
  display:grid;place-items:center;box-shadow:0 8px 26px rgba(124,58,237,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.name{font-weight:900;font-size:30px;letter-spacing:-.01em}
.name b{color:#a78bfa}
h1{font-weight:900;font-size:64px;line-height:1.04;letter-spacing:-.022em}
h1 .g{background:linear-gradient(92deg,#a78bfa,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:'Roboto Mono',monospace;font-size:19px;letter-spacing:.06em;color:#b3adc6;margin-top:24px}
.right{position:relative;flex:none;display:flex;flex-direction:column;gap:18px;width:400px}
.chip{display:flex;align-items:center;gap:16px;padding:20px 24px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.10);border-radius:18px}
.chip .ic{flex:none;width:38px;height:38px;border-radius:11px;background:rgba(124,58,237,.16);
  border:1px solid rgba(167,139,250,.35);display:grid;place-items:center}
.chip .t{font-weight:700;font-size:19px;letter-spacing:-.01em}
.chip .s{font-family:'Roboto Mono',monospace;font-size:13px;color:#b3adc6;margin-top:3px}
</style></head><body>
<div class="enso"><svg width="420" height="420" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="86 100" transform="rotate(18 50 50)"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs></svg></div>
<div class="left">
  <div class="brand">
    <div class="mark"><svg width="25" height="16.3" viewBox="0 0 92 60"><polygon points="0,0 34,30 0,60" fill="#fff"/><polygon points="38,0 72,30 38,60" fill="#fff"/><rect x="80" y="0" width="12" height="60" rx="5" fill="#fff"/></svg></div>
    <div class="name">Ad<b>Sensei</b></div>
  </div>
  <h1>Skip the ad.<br><span class="g">Every ad.</span></h1>
  <div class="tag">No account · no subscription · open source</div>
</div>
<div class="right">
  <div class="chip">
    <div class="ic"><svg width="20" height="13" viewBox="0 0 92 60"><polygon points="0,0 34,30 0,60" fill="#c4b5fd"/><polygon points="38,0 72,30 38,60" fill="#c4b5fd"/><rect x="80" y="0" width="12" height="60" rx="5" fill="#c4b5fd"/></svg></div>
    <div><div class="t">YouTube ads, skipped</div><div class="s">pre-roll · mid-roll · sponsor reads</div></div>
  </div>
  <div class="chip">
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" stroke="#c4b5fd" stroke-width="2" stroke-linejoin="round"/></svg></div>
    <div><div class="t">Block ads on every site</div><div class="s">trackers · popups · cookie notices</div></div>
  </div>
  <div class="chip">
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4" stroke="#c4b5fd" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#c4b5fd"/></svg></div>
    <div><div class="t">AI that stays private</div><div class="s">on-device by default</div></div>
  </div>
</div>
</body></html>
